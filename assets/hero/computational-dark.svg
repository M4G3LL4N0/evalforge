<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="request to authenticate to authorise to record to reject. records cross a trust boundary, get validated, and are held or rejected.">
<title>EvalForge — computational sequence</title>
<desc>A state machine showing the real transition this system performs: request then authenticate then authorise then record then reject. Derived from the project architecture, not decorative.</desc>
<rect width="960" height="300" fill="#0a0d12"/>
<text x="60" y="52" fill="#f4efe44f" font-size="11.5" letter-spacing="2.6">DATA_FLOW · SECURITY</text>
<text x="60" y="80" fill="#f4efe4" font-size="19" font-weight="620" letter-spacing="-0.2">records cross a trust boundary, get validated, and are held or rejected</text>
<rect x="60.0" y="128" width="147.2" height="54" rx="10" fill="#f4efe4" fill-opacity="0.05" stroke="#f4efe424" stroke-width="1.2" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.40s" fill="freeze"/></rect>
